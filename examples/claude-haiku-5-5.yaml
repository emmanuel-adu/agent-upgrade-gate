# Example upgrade PR: same harness, suggested replacement model.
# Copy over .agents/agent.yaml in a branch and open a PR to see the gate run.
name: prod-coding-agent
model:
  provider: litellm
  name: anthropic/claude-haiku-5-5
  # pricing: {input_per_mtok: ..., output_per_mtok: ...}   # set from your provider price sheet;
  # without it the cost check falls back to litellm's price table and warns if that is empty.
  kwargs: {temperature: 0.0, max_tokens: 4096}
harness:
  name: mini-swe-agent
  version: "2.4.6"
  config: mini.yaml
  overrides:
    agent: {step_limit: 40, cost_limit: 1.0}
