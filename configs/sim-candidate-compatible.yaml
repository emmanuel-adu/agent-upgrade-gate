# Simulated upgrade that is behaviourally compatible but somewhat more expensive.
# Expected gate outcome: staged rollout (cost warning), not a block.
name: sim-candidate-compatible
model:
  provider: sim
  name: sim/candidate-v3
  pricing: {input_per_mtok: 1.00, output_per_mtok: 5.00}
  sim:
    skill: 0.97
    explore_steps: [1, 3]
    verify_steps: [1, 1]
    verbosity: 1.25
    ttft_ms: [350, 650]
    ms_per_output_token: 9
harness:
  name: mini-swe-agent
  version: "2.4.6"
  config: mini.yaml
  overrides:
    agent: {step_limit: 30, cost_limit: 1.0}
